<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PermiGest LBSC | Recuperar contraseña</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >
</head>

<body class="login-body">

    <main class="recovery-container">

        <section class="recovery-card">

            <div class="recovery-logo">
                PG
            </div>

            <h1>
                Recuperar contraseña
            </h1>

            <p class="recovery-description">
                Ingrese su correo institucional. Si la cuenta se encuentra
                registrada, recibirá un enlace para crear una nueva contraseña.
            </p>

            <form id="formRecuperarPassword">

                <div class="form-group">

                    <label for="correoRecuperacion">
                        Correo institucional
                    </label>

                    <input
                        type="email"
                        id="correoRecuperacion"
                        autocomplete="email"
                        placeholder="nombre@lbsc.cl"
                        required
                    >

                </div>

                <div
                    id="mensajeRecuperacion"
                    class="form-message"
                >
                </div>

                <button
                    type="submit"
                    id="btnRecuperar"
                    class="btn-primary recovery-button"
                >
                    Enviar enlace de recuperación
                </button>

            </form>

            <div class="recovery-back">

                <a href="/">
                    Volver al inicio de sesión
                </a>

            </div>

            <div class="recovery-footer">
                Liceo Bicentenario Santa Cruz
            </div>

        </section>

    </main>

    <script
        src="{{ url_for('static', filename='js/recuperar_contrasena.js') }}"
    ></script>

</body>

</html>
